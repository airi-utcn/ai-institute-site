name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    # Anything that cannot change an image is ignored. deploy.yml and
    # _build-image.yml are deliberately not ignored so they are exercised;
    # mirror-workflow changes run the mirror workflow instead.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'compose.yaml'
      - 'compose.dev.yaml'
      - 'compose.prod.yaml'
      - 'scripts/**'
      - '.github/workflows/README.md'
      - '.github/workflows/mirror-images.yml'
      - '.github/workflows/_mirror-images.yml'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
      - 'agents/**'
      - '.agents/**'
      - '.gemini/**'

# No `concurrency` cancellation: because each run only rebuilds the services it
# touched, cancelling a superseded run could skip a service entirely. Two
# merges landing close together must both finish.

jobs:
  # Make sure the GHCR copies of every base image exist before any build
  # starts. This only contacts public registries when a tag is missing.
  mirrors:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_mirror-images.yml
    with:
      force: false

  # Work out which services actually changed, so a web-only commit does not
  # rebuild Strapi, Python, and the ~1 GB Snipe-IT image.
  changes:
    needs: mirrors
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      paper_sync: ${{ steps.filter.outputs.paper_sync }}
      snipe_it: ${{ steps.filter.outputs.snipe_it }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.ref }}
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/_build-image.yml'
            web:
              - 'web/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/_build-image.yml'
            paper_sync:
              - 'research-paper-graph/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/_build-image.yml'
            snipe_it:
              - 'snipe-it/**'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/_build-image.yml'

  server:
    needs: [changes, mirrors]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: Server (Strapi)
      context: ./server
      dockerfile: ./server/Dockerfile
      image: server
      public_strapi_url: ${{ vars.PUBLIC_STRAPI_URL }}
      # Relative to PUBLIC_STRAPI_URL. /admin becomes /strapi/admin in prod;
      # /strapi/admin would become the doubled /strapi/strapi/admin.
      strapi_admin_url: ${{ vars.STRAPI_ADMIN_URL || '/admin' }}

  web:
    needs: [changes, mirrors]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: Web (Next.js)
      context: ./web
      dockerfile: ./web/Dockerfile
      image: web
      next_public_strapi_url: ${{ vars.PUBLIC_STRAPI_URL }}

  paper_sync:
    needs: [changes, mirrors]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.paper_sync == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: Paper Sync (Python)
      context: ./research-paper-graph
      dockerfile: ./research-paper-graph/Dockerfile
      image: paper-sync

  snipe_it:
    needs: [changes, mirrors]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.snipe_it == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      service: Snipe-IT
      context: ./snipe-it
      dockerfile: ./snipe-it/Dockerfile
      image: snipe-it
