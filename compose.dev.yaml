# Development Docker Compose configuration
#
# Use `docker compose -f compose.dev.yaml watch` to start all services
# with hot-reload and automatic file sync — no full image rebuilds needed.
#
# How `watch` works:
#   - action: sync  → copies changed files straight into the running container
#                     (HMR in strapi develop / next dev picks them up instantly)
#   - action: rebuild → triggers a full container rebuild only for dependency changes

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  strapi:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    # No static build-time args needed — strapi develop builds the admin live.
    restart: no
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: development
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      STRAPI_ADMIN_URL: ${STRAPI_ADMIN_URL}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SNIPEIT_PUBLIC_URL: ${SNIPEIT_PUBLIC_URL}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DEFAULT_FROM: ${SMTP_DEFAULT_FROM}
      SMTP_DEFAULT_REPLY_TO: ${SMTP_DEFAULT_REPLY_TO}
      DRAFT_NOTIFICATION_ROLE: ${DRAFT_NOTIFICATION_ROLE}
      DRAFT_NOTIFICATION_CRON: ${DRAFT_NOTIFICATION_CRON}
    ports:
      - "1337:1337"
    volumes:
      - ./server/public/uploads:/app/public/uploads
      # Adding another volume so Strapi can write schema changes to the codebase
      # - ./server/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        # Sync application source into the container — strapi develop detects the
        # change and hot-reloads without a container restart.
        - action: sync
          path: ./server/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./server/config
          target: /app/config
          ignore:
            - node_modules/
        - action: sync
          path: ./server/database
          target: /app/database
        # Rebuild the image when dependencies change (slow path, rarely needed).
        - action: rebuild
          path: ./server/package.json
        - action: rebuild
          path: ./server/package-lock.json

  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: no
    environment:
      NODE_ENV: development
      PORT: "3000"
      # Bind to all interfaces so Docker can expose the port
      HOSTNAME: "0.0.0.0"
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      REVALIDATION_ALLOW_QUERY_SECRET: ${REVALIDATION_ALLOW_QUERY_SECRET:-false}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      # Public URL used by the browser (same host, different port in dev)
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-${PUBLIC_STRAPI_URL}}
      # Server-to-server URL inside the Docker network
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://strapi:1337}
      GRAPH_MESO_MIN_NODE_PAPERS: ${GRAPH_MESO_MIN_NODE_PAPERS:-3}
      GRAPH_MESO_MAX_NODES: ${GRAPH_MESO_MAX_NODES:-20}
      GRAPH_MESO_MIN_NODES: ${GRAPH_MESO_MIN_NODES:-8}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_PUBLIC_URL: ${SNIPEIT_PUBLIC_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      AUTH_MICROSOFT_TENANT_ID: ${AUTH_MICROSOFT_TENANT_ID:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_SCOPES: ${AUTH_SCOPES:-openid profile email}
      AUTH_TOKEN_AUTH_METHOD: ${AUTH_TOKEN_AUTH_METHOD:-client_secret_post}
      AUTH_PROVIDER_NAME: "${AUTH_PROVIDER_NAME:-institutional account}"
      AUTH_PROVIDER_LABEL: "${AUTH_PROVIDER_LABEL:-Continue with institutional login}"
      AUTH_OIDC_IDP_HINT: ${AUTH_OIDC_IDP_HINT:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_ALLOWED_GROUPS: ${AUTH_ALLOWED_GROUPS:-}
      AUTH_ALLOWED_GROUP_IDS: ${AUTH_ALLOWED_GROUP_IDS:-}
      AUTH_PROMPT: ${AUTH_PROMPT:-}
      AUTH_SESSION_MAX_AGE_HOURS: ${AUTH_SESSION_MAX_AGE_HOURS:-12}
    ports:
      - "3000:3000"
    depends_on:
      - strapi
    develop:
      watch:
        # Sync source and public assets — next dev / Turbopack picks up changes
        # immediately via HMR without restarting the container.
        - action: sync
          path: ./web/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./web/public
          target: /app/public
        # Sync config files that affect the dev server
        - action: sync
          path: ./web/next.config.mjs
          target: /app/next.config.mjs
        - action: sync
          path: ./web/tailwind.config.mjs
          target: /app/tailwind.config.mjs
        - action: sync
          path: ./web/postcss.config.mjs
          target: /app/postcss.config.mjs
        # Rebuild only when dependencies change
        - action: rebuild
          path: ./web/package.json

  mysql-snipeit:
    image: public.ecr.aws/docker/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SNIPEIT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SNIPEIT_DB_DATABASE}
      MYSQL_USER: ${SNIPEIT_DB_USER}
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD}
    volumes:
      - mysql-snipeit-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$SNIPEIT_DB_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  snipe-it:
    build:
      context: ./snipe-it
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_URL: ${SNIPEIT_PUBLIC_URL:-http://localhost:8000}
      APP_KEY: ${SNIPEIT_APP_KEY}
      APP_TRUSTED_PROXIES: "*"
      APP_TRUSTED_HEADERS: "HEADER_X_FORWARDED_FOR,HEADER_X_FORWARDED_HOST,HEADER_X_FORWARDED_PROTO,HEADER_X_FORWARDED_PORT,HEADER_X_FORWARDED_PREFIX"
      LIVEWIRE_URL_PREFIX: ${SNIPEIT_LIVEWIRE_PREFIX:-/}
      DB_CONNECTION: mysql
      DB_HOST: mysql-snipeit
      DB_DATABASE: ${SNIPEIT_DB_DATABASE}
      DB_USERNAME: ${SNIPEIT_DB_USER}
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD}
      DB_PORT: 3306
    volumes:
      - snipeit-data:/var/lib/snipeit
    depends_on:
      mysql-snipeit:
        condition: service_healthy

  # Paper sync scheduler service (containerized cron, similar to prod).
  # Default local schedule runs every 10 minutes for quick validation.
  # Override with PAPER_SYNC_CRON in .env, e.g. "0 0 * * 6" for Saturday midnight.
  # paper-sync:
  #   build:
  #     context: ./research-paper-graph
  #     dockerfile: Dockerfile
  #   # profiles: ["tools"]
  #   entrypoint: ["bash", "/app/entrypoint.sh"]
  #   environment:
  #     STRAPI_URL: http://strapi:1337
  #     STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
  #     PAPER_SYNC_CRON: ${PAPER_SYNC_CRON:-*/10 * * * *}
  #     TZ: ${PAPER_SYNC_TZ:-UTC}
  #     GRAPH_SIMILARITY_THRESHOLD: ${GRAPH_SIMILARITY_THRESHOLD:-0.6}
  #     GRAPH_DUPLICATE_THRESHOLD: ${GRAPH_DUPLICATE_THRESHOLD:-0.92}
  #     GRAPH_AI_MODEL: ${GRAPH_AI_MODEL:-all-MiniLM-L6-v2}
  #     GRAPH_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_HDBSCAN_MIN_CLUSTER_SIZE:-12}
  #     GRAPH_HDBSCAN_MIN_SAMPLES: ${GRAPH_HDBSCAN_MIN_SAMPLES:-3}
  #     GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD: ${GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD:-0.7}
  #     GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE:-3}
  #     GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES: ${GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES:-2}
  #     GRAPH_TOP_K: ${GRAPH_TOP_K:-20}
  #   volumes:
  #     - ./research-paper-graph:/app
  #   depends_on:
  #     - strapi

  # One-off runner for manual local checks (no cron loop).
  # Example:
  # docker compose -f compose.dev.yaml --profile tools run --rm paper-sync-once
  # paper-sync-once:
  #   build:
  #     context: ./research-paper-graph
  #     dockerfile: Dockerfile
  #   profiles: ["tools"]
  #   entrypoint: ["python", "main.py"]
  #   environment:
  #     STRAPI_URL: http://strapi:1337
  #     STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
  #     GRAPH_SIMILARITY_THRESHOLD: ${GRAPH_SIMILARITY_THRESHOLD:-0.6}
  #     GRAPH_DUPLICATE_THRESHOLD: ${GRAPH_DUPLICATE_THRESHOLD:-0.92}
  #     GRAPH_AI_MODEL: ${GRAPH_AI_MODEL:-all-MiniLM-L6-v2}
  #     GRAPH_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_HDBSCAN_MIN_CLUSTER_SIZE:-12}
  #     GRAPH_HDBSCAN_MIN_SAMPLES: ${GRAPH_HDBSCAN_MIN_SAMPLES:-3}
  #     GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD: ${GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD:-0.7}
  #     GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE:-3}
  #     GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES: ${GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES:-2}
  #     GRAPH_TOP_K: ${GRAPH_TOP_K:-20}
  #   volumes:
  #     - ./research-paper-graph:/app
  #   depends_on:
  #     - strapi

volumes:
  pgdata:
  mysql-snipeit-data:
  snipeit-data:
