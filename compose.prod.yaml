# Production server stack: pulls prebuilt GHCR images, no local builds.
# Usage: docker compose -f compose.prod.yaml up -d
services:
  postgres:
    # Use ECR Public mirror to avoid Docker Hub limits
    image: public.ecr.aws/docker/library/postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  strapi:
    # -----------------------------------------------------------
    # CHANGE THIS: Replace 'YOUR_GITHUB_USER' with your username
    # -----------------------------------------------------------
    image: ghcr.io/airi-utcn/ai-institute-site/server:latest
    restart: always
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: production
      # These public URLs are baked in at build time, but Strapi sometimes needs them here too
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      STRAPI_ADMIN_URL: ${STRAPI_ADMIN_URL}
      # Secrets
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DEFAULT_FROM: ${SMTP_DEFAULT_FROM}
      SMTP_DEFAULT_REPLY_TO: ${SMTP_DEFAULT_REPLY_TO}
      DRAFT_NOTIFICATION_ROLE: ${DRAFT_NOTIFICATION_ROLE}
      DRAFT_NOTIFICATION_CRON: ${DRAFT_NOTIFICATION_CRON}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      # We still need to persist uploads!
      - ./uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep 1337 || exit 1"] # Don't question it. It works.
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nextjs:
    image: ghcr.io/airi-utcn/ai-institute-site/web:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      # Browser/public base URL (used to prefix media URLs): should be reachable by end users.
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-${PUBLIC_STRAPI_URL}}
      # Server-to-server base URL inside the Docker network.
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://strapi:1337}
      GRAPH_MESO_MIN_NODE_PAPERS: ${GRAPH_MESO_MIN_NODE_PAPERS:-3}
      GRAPH_MESO_MAX_NODES: ${GRAPH_MESO_MAX_NODES:-20}
      GRAPH_MESO_MIN_NODES: ${GRAPH_MESO_MIN_NODES:-8}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_PUBLIC_URL: ${SNIPEIT_PUBLIC_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      CLIENT_URL: ${CLIENT_URL}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      strapi:
        condition: service_healthy

  watchtower:
    # Use GHCR mirror for Watchtower
    image: ghcr.io/containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the Docker config directory (contains auth credentials)
      # Prod server specific: you need to be careful on how you did the docker login on the prod server. This assumes you have a config.json with credentials for GHCR auth in ~/.docker/config.json
      - ~/.docker/config.json:/config.json:ro
    command: --interval 300 --cleanup
    environment:
      # Alternative: use env vars if config.json mount fails
      REPO_USER: ${REPO_USER}
      REPO_PASS: ${REPO_PASS}
    restart: always

  # Automated daily PostgreSQL backups, retained for BACKUP_RETENTION_DAYS (7 by default).
  db-backup:
    image: public.ecr.aws/docker/library/postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    # The stock image runs as "postgres"; root lets it write to a root-created bind mount.
    user: "0:0"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    # Dump immediately, then every 24h. Write to a temp file so a failed dump never
    # leaves a half-written backup behind.
    entrypoint: >
      sh -c '
        umask 077
        while true; do
          TIMESTAMP=$$(date +%Y-%m-%d_%H-%M-%S)
          TMP=/backups/.backup_$$TIMESTAMP.dump.tmp
          echo "[$$TIMESTAMP] Starting PostgreSQL backup..."
          if pg_dump -Fc -f "$$TMP" && pg_restore --list "$$TMP" >/dev/null; then
            mv "$$TMP" /backups/backup_$$TIMESTAMP.dump
            echo "[$$TIMESTAMP] Backup complete: backup_$$TIMESTAMP.dump"
            find /backups -name "backup_*.dump" -mtime +$$BACKUP_RETENTION_DAYS -delete
          else
            rm -f "$$TMP"
            echo "[$$TIMESTAMP] PostgreSQL backup failed; keeping old backups" >&2
          fi
          echo "Next PostgreSQL backup in 24h..."
          sleep 86400
        done
      '
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Automated daily MySQL backups for Snipe-IT, following the same pattern as db-backup.
  snipeit-db-backup:
    image: public.ecr.aws/docker/library/mysql:8.0
    depends_on:
      mysql-snipeit:
        condition: service_healthy
    # The stock image runs as "mysql"; root lets it write to a root-created bind mount.
    user: "0:0"
    environment:
      MYSQL_HOST: mysql-snipeit
      MYSQL_DATABASE: ${SNIPEIT_DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${SNIPEIT_DB_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    # Dump immediately, then every 24h. The SQL is fully written before compression,
    # so a failed mysqldump is not disguised by a successful gzip exit code.
    entrypoint: >
      sh -c '
        umask 077
        while true; do
          TIMESTAMP=$$(date +%Y-%m-%d_%H-%M-%S)
          TMP_SQL=/backups/.snipeit_$$TIMESTAMP.sql.tmp
          TMP_GZ=/backups/.snipeit_$$TIMESTAMP.sql.gz.tmp
          echo "[$$TIMESTAMP] Starting Snipe-IT MySQL backup..."
          if MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqldump \
              --host="$$MYSQL_HOST" \
              --user=root \
              --single-transaction \
              --quick \
              --routines \
              --triggers \
              --events \
              --default-character-set=utf8mb4 \
              --set-gtid-purged=OFF \
              "$$MYSQL_DATABASE" > "$$TMP_SQL"; then
            if gzip -9 -c "$$TMP_SQL" > "$$TMP_GZ" && gzip -t "$$TMP_GZ"; then
              mv "$$TMP_GZ" /backups/snipeit_$$TIMESTAMP.sql.gz
              echo "[$$TIMESTAMP] Backup complete: snipeit_$$TIMESTAMP.sql.gz"
              find /backups -name "snipeit_*.sql.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete
            else
              rm -f "$$TMP_GZ"
              echo "[$$TIMESTAMP] Snipe-IT MySQL backup compression failed; keeping old backups" >&2
            fi
          else
            echo "[$$TIMESTAMP] Snipe-IT MySQL backup failed; keeping old backups" >&2
          fi
          rm -f "$$TMP_SQL" "$$TMP_GZ"
          echo "Next Snipe-IT MySQL backup in 24h..."
          sleep 86400
        done
      '
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Uploaded media lives outside the databases, so it needs its own snapshot.
  # Strapi uploads are a bind mount; Snipe-IT stores uploads/logs in its named volume.
  files-backup:
    image: public.ecr.aws/docker/library/alpine:3.20
    user: "0:0"
    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./uploads:/data/strapi-uploads:ro
      - snipeit-data:/data/snipeit:ro
      - paper-sync-outputs:/data/paper-sync:ro
      - "${BACKUP_DIR:-./backups}:/backups"
    # Snapshot immediately, then every 24h. Archives are written to temp files first
    # so a failed tar does not masquerade as a usable snapshot.
    entrypoint: >
      sh -c '
        umask 077
        while true; do
          TIMESTAMP=$$(date +%Y-%m-%d_%H-%M-%S)
          TMP_UPLOADS=/backups/.strapi-uploads_$$TIMESTAMP.tar.gz.tmp
          TMP_SNIPEIT=/backups/.snipeit-data_$$TIMESTAMP.tar.gz.tmp
          TMP_PAPERSYNC=/backups/.paper-sync-outputs_$$TIMESTAMP.tar.gz.tmp
          echo "[$$TIMESTAMP] Starting Strapi uploads snapshot..."
          if tar -czf "$$TMP_UPLOADS" -C /data strapi-uploads && gzip -t "$$TMP_UPLOADS"; then
            mv "$$TMP_UPLOADS" /backups/strapi-uploads_$$TIMESTAMP.tar.gz
            echo "[$$TIMESTAMP] Snapshot complete: strapi-uploads_$$TIMESTAMP.tar.gz"
            find /backups -name "strapi-uploads_*.tar.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete
          else
            rm -f "$$TMP_UPLOADS"
            echo "[$$TIMESTAMP] Strapi uploads snapshot failed; keeping old snapshots" >&2
          fi
          echo "[$$TIMESTAMP] Starting Snipe-IT data snapshot..."
          if tar -czf "$$TMP_SNIPEIT" -C /data snipeit && gzip -t "$$TMP_SNIPEIT"; then
            mv "$$TMP_SNIPEIT" /backups/snipeit-data_$$TIMESTAMP.tar.gz
            echo "[$$TIMESTAMP] Snapshot complete: snipeit-data_$$TIMESTAMP.tar.gz"
            find /backups -name "snipeit-data_*.tar.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete
          else
            rm -f "$$TMP_SNIPEIT"
            echo "[$$TIMESTAMP] Snipe-IT data snapshot failed; keeping old snapshots" >&2
          fi
          echo "[$$TIMESTAMP] Starting paper-sync outputs snapshot..."
          if tar -czf "$$TMP_PAPERSYNC" -C /data paper-sync && gzip -t "$$TMP_PAPERSYNC"; then
            mv "$$TMP_PAPERSYNC" /backups/paper-sync-outputs_$$TIMESTAMP.tar.gz
            echo "[$$TIMESTAMP] Snapshot complete: paper-sync-outputs_$$TIMESTAMP.tar.gz"
            find /backups -name "paper-sync-outputs_*.tar.gz" -mtime +$$BACKUP_RETENTION_DAYS -delete
          else
            rm -f "$$TMP_PAPERSYNC"
            echo "[$$TIMESTAMP] paper-sync outputs snapshot failed; keeping old snapshots" >&2
          fi
          echo "Next file snapshot in 24h..."
          sleep 86400
        done
      '
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # One-off helper for restoring file snapshots on the same machine.
  # It is never started by "docker compose up"; use --profile tools:
  #   docker compose -f compose.prod.yaml --profile tools run --rm files-restore -c \
  #     'tar -xzf /backups/strapi-uploads_....tar.gz -C /data'
  files-restore:
    image: public.ecr.aws/docker/library/alpine:3.20
    profiles: ["tools"]
    user: "0:0"
    volumes:
      - ./uploads:/data/strapi-uploads
      - snipeit-data:/data/snipeit
      - paper-sync-outputs:/data/paper-sync
      - "${BACKUP_DIR:-./backups}:/backups:ro\"
    entrypoint: ["sh"]

  paper-sync:
    image: ghcr.io/airi-utcn/ai-institute-site/paper-sync:latest
    restart: always
    environment:
      # Strapi connection (inside Docker network)
      STRAPI_URL: ${STRAPI_INTERNAL_URL:-http://strapi:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      # Cron schedule & timezone
      PAPER_SYNC_CRON: ${PAPER_SYNC_CRON:-0 0 * * 6}
      TZ: ${PAPER_SYNC_TZ:-UTC}
      # Graph tuning knobs used by research-paper-graph runtime settings
      GRAPH_SIMILARITY_THRESHOLD: ${GRAPH_SIMILARITY_THRESHOLD:-0.5}
      GRAPH_DUPLICATE_THRESHOLD: ${GRAPH_DUPLICATE_THRESHOLD:-0.92}
      GRAPH_AI_MODEL: ${GRAPH_AI_MODEL:-all-MiniLM-L6-v2}
      GRAPH_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_HDBSCAN_MIN_CLUSTER_SIZE:-20}
      GRAPH_HDBSCAN_MIN_SAMPLES: ${GRAPH_HDBSCAN_MIN_SAMPLES:-5}
      GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD: ${GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD:-0.7}
      GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE:-3}
      GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES: ${GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES:-2}
      GRAPH_TOP_K: ${GRAPH_TOP_K:-20}
    volumes:
      # Keep generated graph artifacts and the fetch cache across container restarts.
      - paper-sync-outputs:/app/outputs
    depends_on:
      strapi:
        condition: service_healthy

  mysql-snipeit:
    image: public.ecr.aws/docker/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SNIPEIT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SNIPEIT_DB_DATABASE}
      MYSQL_USER: ${SNIPEIT_DB_USER}
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD}
    healthcheck:
      # The container only receives MYSQL_ROOT_PASSWORD, not SNIPEIT_DB_ROOT_PASSWORD.
      # "status" (unlike "ping") also fails when authentication is wrong.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin status --silent >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mysql-snipeit-data:/var/lib/mysql

  snipe-it:
    image: ghcr.io/airi-utcn/ai-institute-site/snipe-it:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_ENV: production
      APP_URL: ${SNIPEIT_PUBLIC_URL:-https://airi.utcluj.ro/snipeit}
      APP_KEY: ${SNIPEIT_APP_KEY}
      APP_FORCE_TLS: "true"
      APP_TRUSTED_PROXIES: "*"
      APP_TRUSTED_HEADERS: "HEADER_X_FORWARDED_FOR,HEADER_X_FORWARDED_HOST,HEADER_X_FORWARDED_PROTO,HEADER_X_FORWARDED_PORT,HEADER_X_FORWARDED_PREFIX"
      LIVEWIRE_URL_PREFIX: ${SNIPEIT_LIVEWIRE_PREFIX:-/}
      DB_CONNECTION: mysql
      DB_HOST: mysql-snipeit
      DB_DATABASE: ${SNIPEIT_DB_DATABASE}
      DB_USERNAME: ${SNIPEIT_DB_USER}
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD}
      DB_PORT: 3306
    volumes:
      - snipeit-data:/var/lib/snipeit
    depends_on:
      mysql-snipeit:
        condition: service_healthy

volumes:
  pgdata:
  mysql-snipeit-data:
  snipeit-data:
  paper-sync-outputs:
