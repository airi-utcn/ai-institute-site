# Default local stack: builds images from source and simulates production.
# Usage: docker compose up --build
services:
  postgres:
    # Use ECR Public mirror for Postgres to avoid Docker Hub limits
    image: public.ecr.aws/docker/library/postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  strapi:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
        STRAPI_ADMIN_URL: ${STRAPI_ADMIN_URL}
    restart: always
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      STRAPI_ADMIN_URL: ${STRAPI_ADMIN_URL}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_PUBLIC_URL: ${SNIPEIT_PUBLIC_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DEFAULT_FROM: ${SMTP_DEFAULT_FROM}
      SMTP_DEFAULT_REPLY_TO: ${SMTP_DEFAULT_REPLY_TO}
      DRAFT_NOTIFICATION_ROLE: ${DRAFT_NOTIFICATION_ROLE}
      DRAFT_NOTIFICATION_CRON: ${DRAFT_NOTIFICATION_CRON}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
    ports:
      - "1337:1337"
    volumes:
      - ./server/public/uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The fucking health check kept failing. This is an ugly workaround.
      test: ["CMD-SHELL", "netstat -tln | grep 1337 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nextjs:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET}
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      # Browser/public base URL (used to prefix media URLs): should be reachable by end users.
      # Example prod: https://airi.utcluj.ro/strapi
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:-${PUBLIC_STRAPI_URL}}

      # Server-to-server base URL inside the Docker network.
      # Example: http://strapi:1337
      STRAPI_INTERNAL_URL: ${STRAPI_INTERNAL_URL:-http://strapi:1337}
      GRAPH_MESO_MIN_NODE_PAPERS: ${GRAPH_MESO_MIN_NODE_PAPERS:-3}
      GRAPH_MESO_MAX_NODES: ${GRAPH_MESO_MAX_NODES:-20}
      GRAPH_MESO_MIN_NODES: ${GRAPH_MESO_MIN_NODES:-8}
      SNIPEIT_URL: ${SNIPEIT_URL}
      SNIPEIT_PUBLIC_URL: ${SNIPEIT_PUBLIC_URL}
      SNIPEIT_API_KEY: ${SNIPEIT_API_KEY}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      AUTH_MICROSOFT_TENANT_ID: ${AUTH_MICROSOFT_TENANT_ID:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_SCOPES: ${AUTH_SCOPES:-openid profile email}
      AUTH_TOKEN_AUTH_METHOD: ${AUTH_TOKEN_AUTH_METHOD:-client_secret_post}
      AUTH_PROVIDER_NAME: "${AUTH_PROVIDER_NAME:-institutional account}"
      AUTH_PROVIDER_LABEL: "${AUTH_PROVIDER_LABEL:-Continue with institutional login}"
      AUTH_OIDC_IDP_HINT: ${AUTH_OIDC_IDP_HINT:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_ALLOWED_GROUPS: ${AUTH_ALLOWED_GROUPS:-}
      AUTH_ALLOWED_GROUP_IDS: ${AUTH_ALLOWED_GROUP_IDS:-}
      AUTH_PROMPT: ${AUTH_PROMPT:-}
      AUTH_SESSION_MAX_AGE_HOURS: ${AUTH_SESSION_MAX_AGE_HOURS:-12}
    ports:
      - "3000:3000"
    depends_on:
      strapi:
        condition: service_healthy

  # Paper sync service — run manually or on a cron schedule.
  # Usage: docker compose run --rm paper-sync --institution "..."
  paper-sync:
    build:
      context: ./research-paper-graph
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      PAPER_SYNC_CRON: ${PAPER_SYNC_CRON:-0 0 * * 6}
      TZ: ${PAPER_SYNC_TZ:-UTC}
      GRAPH_SIMILARITY_THRESHOLD: ${GRAPH_SIMILARITY_THRESHOLD:-0.6}
      GRAPH_DUPLICATE_THRESHOLD: ${GRAPH_DUPLICATE_THRESHOLD:-0.92}
      GRAPH_AI_MODEL: ${GRAPH_AI_MODEL:-all-MiniLM-L6-v2}
      GRAPH_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_HDBSCAN_MIN_CLUSTER_SIZE:-12}
      GRAPH_HDBSCAN_MIN_SAMPLES: ${GRAPH_HDBSCAN_MIN_SAMPLES:-3}
      GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD: ${GRAPH_SECONDARY_CLUSTER_DISTANCE_THRESHOLD:-0.7}
      GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE: ${GRAPH_TOPIC_HDBSCAN_MIN_CLUSTER_SIZE:-3}
      GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES: ${GRAPH_TOPIC_HDBSCAN_MIN_SAMPLES:-2}
      GRAPH_TOP_K: ${GRAPH_TOP_K:-20}
    volumes:
      - ./research-paper-graph/outputs:/app/outputs
    depends_on:
      strapi:
        condition: service_healthy

  mysql-snipeit:
    image: public.ecr.aws/docker/library/mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SNIPEIT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SNIPEIT_DB_DATABASE}
      MYSQL_USER: ${SNIPEIT_DB_USER}
      MYSQL_PASSWORD: ${SNIPEIT_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$SNIPEIT_DB_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - mysql-snipeit-data:/var/lib/mysql

  snipe-it:
    image: snipe/snipe-it:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_URL: ${SNIPEIT_PUBLIC_URL:-http://localhost:8000}
      APP_KEY: ${SNIPEIT_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql-snipeit
      DB_DATABASE: ${SNIPEIT_DB_DATABASE}
      DB_USERNAME: ${SNIPEIT_DB_USER}
      DB_PASSWORD: ${SNIPEIT_DB_PASSWORD}
      DB_PORT: 3306
      # Kept for Snipe-IT account/admin mail. Reservation emails come from Strapi.
      MAIL_DRIVER: smtp
      MAIL_PORT_587_TCP_ADDR: ${SMTP_HOST:-}
      MAIL_PORT_587_TCP_PORT: ${SMTP_PORT:-587}
      MAIL_ENV_USERNAME: ${SMTP_USERNAME:-}
      MAIL_ENV_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_ENV_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      MAIL_ENV_FROM_ADDR: ${SMTP_DEFAULT_FROM:-}
      MAIL_ENV_FROM_NAME: ${SMTP_DEFAULT_FROM_NAME:-AIRi @ UTCN}
    volumes:
      - snipeit-data:/var/lib/snipeit
    depends_on:
      mysql-snipeit:
        condition: service_healthy

volumes:
  pgdata:
  mysql-snipeit-data:
  snipeit-data:
